<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SupportPilot — explainable triage</title><meta name="description" content="Классификация и SLA обращений поддержки"><style>
:root{--bg:#f3f6f8;--ink:#18242d;--nav:#101c25;--cyan:#1dc9b7;--red:#f05d5e;--yellow:#f4c95d;--line:#dce3e7;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Inter,system-ui,sans-serif}.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{background:var(--nav);color:white;padding:25px 18px}.logo{font-size:20px;font-weight:900;margin-bottom:38px}.logo i{font-style:normal;color:var(--cyan)}.side button{width:100%;border:0;background:transparent;color:#9fb0bb;text-align:left;padding:12px;border-radius:8px;margin:3px 0}.side .active{background:#1d303c;color:white}.count{float:right;background:var(--red);color:white;padding:2px 7px;border-radius:99px}.main{padding:30px 3.5vw}.head{display:flex;justify-content:space-between;align-items:center}.head h1{font-size:36px;letter-spacing:-2px;margin:0}.online{color:#178873}.online:before{content:"";display:inline-block;width:8px;height:8px;background:var(--cyan);border-radius:50%;margin-right:7px}.composer{display:flex;gap:10px;margin:22px 0}.composer textarea{flex:1;min-height:74px;border:1px solid var(--line);border-radius:9px;padding:13px;resize:vertical}.composer button,.send{background:var(--nav);color:white;border:0;border-radius:8px;padding:0 18px;cursor:pointer}.workspace{display:grid;grid-template-columns:1fr 1.15fr;background:white;border:1px solid var(--line);border-radius:13px;overflow:hidden;min-height:500px}.queue{border-right:1px solid var(--line)}.ticket{padding:17px;border-bottom:1px solid var(--line);cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:12px}.ticket:hover,.ticket.active{background:#f0fbf9}.avatar{width:38px;height:38px;border-radius:10px;background:#d6e7f1;display:grid;place-items:center;font-weight:800}.ticket p{margin:6px 0;color:#687781}.priority{width:9px;height:9px;border-radius:50%;background:#9caab3;margin-top:5px}.priority.normal{background:var(--yellow)}.priority.high{background:var(--red)}.detail{padding:28px}.tag{display:inline-block;background:#e0f7f3;color:#087a6b;padding:6px 9px;border-radius:5px;font-size:11px;font-weight:800}.detail h2{font-size:25px;margin:18px 0 8px}.meta{color:#7a8790}.message{margin:24px 0;padding:18px;background:var(--bg);border-radius:10px;line-height:1.7}.explain{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:13px}.signal{font-size:11px;border:1px solid var(--line);padding:5px 8px;border-radius:99px}.ai{border:1px solid #a8e5dc;background:#f0fffc;padding:18px;border-radius:10px}.ai b{color:#087a6b}.ai textarea{width:100%;min-height:80px;margin:13px 0;border:1px solid #c6dedb;padding:12px;border-radius:7px;resize:none}.done{display:none;color:#087a6b;margin-left:10px}.done.show{display:inline}@media(max-width:800px){.shell{grid-template-columns:1fr}.side{display:none}.workspace{grid-template-columns:1fr}.queue{border-right:0}.detail{border-top:1px solid var(--line)}}
</style></head><body><div class="shell"><aside class="side"><div class="logo">Support<i>Pilot</i></div><button class="active">Входящие <span class="count" id="count">3</span></button><button>Мои обращения</button><button>Правила triage</button><button>Аналитика SLA</button></aside><main class="main"><header class="head"><h1>Очередь обращений</h1><span class="online">Explainable rules активны</span></header><form class="composer" id="newTicket"><textarea id="newMessage" placeholder="Вставьте обращение клиента для классификации…">С карты дважды списалась оплата, это срочно</textarea><button>Классифицировать</button></form><section class="workspace"><div class="queue" id="tickets"></div><article class="detail"><span class="tag" id="tag"></span><h2 id="subject"></h2><div class="meta" id="meta"></div><div class="message" id="message"></div><div class="explain" id="signals"></div><div class="ai"><b>✦ Предложенный ответ</b><textarea id="reply"></textarea><button class="send" id="send">Отметить обработанным</button><span class="done" id="done">✓ Готово</span></div></article></section></main></div><script type="module">
import{triage}from'./src/triage.js';let tickets=[{customer:'Марина',subject:'Списали оплату дважды',message:'Сегодня с карты дважды списалась оплата. Помогите вернуть второй платеж.'},{customer:'Алексей',subject:'Не работает экспорт',message:'Экспорт не работает, появляется пустой файл и это блокирует отчет.'},{customer:'Елена',subject:'Как изменить тариф?',message:'Подскажите стоимость перехода на другой тариф.'}].map(x=>triage(x));let active=0;const root=document.querySelector('#tickets');function renderList(){root.innerHTML=tickets.map((x,i)=>`<div class="ticket ${i===active?'active':''}" data-i="${i}"><div class="avatar">${x.customer[0]}</div><div><b>${x.customer}</b><p>${x.subject}</p></div><i class="priority ${x.classification.priority}"></i></div>`).join('');root.querySelectorAll('.ticket').forEach(x=>x.onclick=()=>{active=+x.dataset.i;render()});document.querySelector('#count').textContent=tickets.length}function renderDetail(){const x=tickets[active],c=x.classification;document.querySelector('#tag').textContent=`${c.label.toUpperCase()} · ${c.priority.toUpperCase()} · SLA ${x.sla.minutes} мин`;document.querySelector('#subject').textContent=x.subject;document.querySelector('#meta').textContent=`${x.customer} · уверенность ${(c.confidence*100).toFixed(0)}%`;document.querySelector('#message').textContent=x.message;document.querySelector('#signals').innerHTML=[...c.matches,...c.urgentMatches].map(s=>`<span class="signal">признак: ${s}</span>`).join('')||'<span class="signal">fallback: ручная проверка</span>';document.querySelector('#reply').value=x.draft;document.querySelector('#done').classList.remove('show')}function render(){renderList();renderDetail()}document.querySelector('#newTicket').onsubmit=e=>{e.preventDefault();const message=document.querySelector('#newMessage').value.trim();if(!message)return;tickets.unshift(triage({customer:'Новый клиент',subject:message.slice(0,42),message}));active=0;render()};document.querySelector('#send').onclick=()=>document.querySelector('#done').classList.add('show');render();
</script></body></html>
